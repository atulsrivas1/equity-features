name: R10 release qualification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  r10:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: f20abd5acd74a4917fdaf087e9c92757746e7ea4
          path: work/accepted-io
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-workers
          ref: b56701cc1e48920378df18a2081d0f5f9f4ad3bb
          path: work/accepted-workers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_boundary.py
      - run: python tools/build_r10.py --io work/accepted-io --workers work/accepted-workers
      - uses: actions/upload-artifact@v4
        with:
          name: r10-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/r10/
          retention-days: 30
          if-no-files-found: error
