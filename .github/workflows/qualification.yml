name: Source-bound qualification
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      record: ${{ steps.classify.outputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify complete committed source
        id: classify
        run: |
          mkdir -p dist/ci/scope
          python - <<'PY' > dist/ci/scope/classification.json
          import os, subprocess, sys
          fixed = dict(os.environ)
          fixed['GITHUB_SHA'] = '0' * 40
          raise SystemExit(subprocess.run([sys.executable, 'tools/ci_scope.py'], env=fixed).returncode)
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path('dist/ci/scope/classification.json').read_bytes())
          assert record['valid'] is True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8', newline='\n') as output:
              output.write('record=' + json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Retain exact scope, including rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-scope-${{ github.sha }}-${{ github.event_name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/ci/scope/
          retention-days: 30
          overwrite: false
          if-no-files-found: error
  docs:
    uses: ./.github/workflows/docs.yml
  agent-evidence:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/agent-evidence.yml
  agent-ledger:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/agent-ledger.yml
  conformance:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/conformance.yml
  continuous:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/continuous.yml
  diagnostics:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/diagnostics.yml
  evidence:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/evidence.yml
  evidence-evaluation:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/evidence-evaluation.yml
  evidence-pilot:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/evidence-pilot.yml
  explanations:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/explanations.yml
  packages:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/packages.yml
  provenance:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/provenance.yml
  quickstart:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/quickstart.yml
  r9:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/r9.yml
  r10:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/r10.yml
  research:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/research.yml
  transport:
    needs: scope
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.record).valid && fromJSON(needs.scope.outputs.record).decision == 'FULL' }}
    uses: ./.github/workflows/transport.yml
  check:
    if: always()
    needs: ["scope", "docs", "agent-evidence", "agent-ledger", "conformance", "continuous", "diagnostics", "evidence", "evidence-evaluation", "evidence-pilot", "explanations", "packages", "provenance", "quickstart", "r9", "r10", "research", "transport"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every logical result and committed source
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tools/ci_provenance.py
      - name: Retain policy, including rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-policy-${{ github.sha }}-${{ github.event_name }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/ci/policy/
          retention-days: 30
          overwrite: false
          if-no-files-found: error
