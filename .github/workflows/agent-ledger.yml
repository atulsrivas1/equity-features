name: Agent local ledger checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent-ledger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/contracts -e packages/evidence -e packages/agent-evidence -e packages/agent-ledger
      - run: python -m pip check
      - run: python tools/check_boundary.py
      - run: python -m mypy --strict packages/agent-ledger/src examples/agent_ledger_typed.py
      - run: python -I -m unittest discover -s tests/agent_evidence
      - run: python tools/build_agent_ledger.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-ledger-${{ github.sha }}-${{ matrix.os }}
          path: dist/agent-ledger/
          retention-days: 30
          if-no-files-found: error
