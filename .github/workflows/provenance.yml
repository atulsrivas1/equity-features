name: Provenance package checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  provenance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: eddd0d35e9715b73c859fc68f5a00de56793dbf7
          path: work/accepted-io
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-workers
          ref: 8d0cececc9ac8e9624775d78dca76e469da256e4
          path: work/accepted-workers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_boundary.py
      - run: python tools/build_provenance.py --io work/accepted-io --workers work/accepted-workers
      - uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/provenance/
          retention-days: 30
          if-no-files-found: error
