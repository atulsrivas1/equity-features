name: Continuous package checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  continuous:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/contracts -e packages/continuous
      - run: python -m pip check
      - run: python -B tools/check_boundary.py
      - run: python -B tools/check_continuous_boundary.py
      - run: python -B -m mypy --strict packages/continuous/src
      - run: python -I -B -m unittest discover -s tests/continuous
      - run: python -B tools/build_continuous.py
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/continuous/
          retention-days: 30
          if-no-files-found: error
