name: Diagnostic package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/contracts -e packages/evidence -e packages/diagnostics
      - run: python -m pip check
      - run: python tools/check_boundary.py
      - run: python -m mypy --strict packages/diagnostics/src
      - run: python -I -m unittest discover -s tests/diagnostics
      - run: python tools/build_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.sha }}-${{ matrix.os }}
          path: dist/diagnostics/
          retention-days: 30
          if-no-files-found: error
