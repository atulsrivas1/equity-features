name: Minimal newcomer quickstart
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify fail-closed artifact and replay boundaries
        run: python tools/test_quickstart_verifier.py
      - name: Replay the documented minimal quickstart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_quickstart.py
      - name: Retain quickstart evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            work/eq132-quickstart-*/report.json
            work/eq132-quickstart-*/logs/*.txt
          retention-days: 30
          if-no-files-found: error
