name: Evidence evaluation qualification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      study_id:
        description: Reviewed fixed study reservation ID (one attempt, no adaptive reruns)
        required: true
        type: string
permissions:
  contents: read
jobs:
  evidence-evaluation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EQ117_STUDY_ID: ${{ inputs.study_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: 18d86761aa3eebb7414e51e8fa2aba089717b5eb
          path: .eq117-inputs/io
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_boundary.py
      - name: Qualification only (no scheduled measurements)
        if: github.event_name != 'workflow_dispatch'
        run: python tools/build_evidence_evaluation.py qualify
      - name: Fixed study after qualification
        if: github.event_name == 'workflow_dispatch'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'tools/build_evidence_evaluation.py', 'study', os.environ['EQ117_STUDY_ID']], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-evaluation-${{ github.sha }}-${{ github.event_name }}-${{ matrix.os }}
          path: dist/evidence-evaluation/
          retention-days: 30
          if-no-files-found: error
