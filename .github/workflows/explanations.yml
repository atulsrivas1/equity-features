name: Explanation package checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  explanations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/contracts -e packages/evidence -e packages/explanations
      - run: python -m pip check
      - run: python tools/check_boundary.py
      - run: python -m mypy --strict packages/explanations/src
      - run: python -I -m unittest discover -s tests/explanations
      - run: python tools/build_explanations.py
      - uses: actions/upload-artifact@v4
        with:
          name: explanations-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/explanations/
          retention-days: 30
          if-no-files-found: error
