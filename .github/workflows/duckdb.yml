name: Optional DuckDB adapter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  duckdb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-duckdb.txt
      - run: python -m pip install --no-build-isolation --no-deps -e packages/contracts -e packages/features -e packages/duckdb
      - run: python -m pip check
      - run: python -m mypy --strict packages/duckdb/src
      - run: python -m unittest discover -s tests/duckdb
      - run: python tools/build_duckdb.py
      - name: Retain qualified optional adapter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ github.sha }}-${{ matrix.os }}
          path: dist/duckdb/
          retention-days: 30
          if-no-files-found: error
