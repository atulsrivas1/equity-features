name: Foundation package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e packages/contracts -e packages/features
      - run: python -m pip check
      - run: python tools/verify_imports.py
      - run: python tools/verify_compatibility.py
      - run: python -m mypy --strict packages/contracts/src packages/features/src
      - run: python -m unittest discover -s tests/unit
      - run: python tools/check_boundary.py
      - run: python tools/build_foundation.py
      - name: Retain verified experimental foundation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ github.sha }}-${{ matrix.os }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
