name: Foundation package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e packages/contracts -e packages/features
      - run: python -m pip check
      - run: python tools/verify_imports.py
      - run: python tools/verify_compatibility.py
