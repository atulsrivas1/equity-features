name: Foundation package checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e packages/contracts -e packages/features -e examples/external_consumer
      - run: python -m pip check
      - run: python tools/verify_imports.py
      - run: python tools/verify_compatibility.py
      - run: python -m mypy --strict packages/contracts/src packages/features/src examples/in_memory_adapter.py examples/external_consumer/src examples/typed_caller.py
      - run: python -m unittest discover -s tests/unit
      - run: python tools/check_boundary.py
      - run: python tools/build_foundation.py
      - name: Retain verified experimental foundation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Install intraday preparation package
        run: python -m pip install --no-deps --no-build-isolation -e packages/intraday
      - run: python -m pip check
      - run: python -B tools/check_intraday_boundary.py
      - run: python -B -m mypy --strict packages/intraday/src
      - run: python -I -B -m unittest discover -s tests/intraday
      - run: python -B tools/build_intraday.py
      - name: Retain verified experimental intraday artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intraday-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/intraday/
          retention-days: 30
          if-no-files-found: error
