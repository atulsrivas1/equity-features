name: R9 release qualification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  r9:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07cfa3bf5c9a268ed73aed99c067030606b5493d
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: 18d86761aa3eebb7414e51e8fa2aba089717b5eb
          path: work/r9-io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_boundary.py
      - run: python tools/build_r9.py
      - uses: actions/upload-artifact@v4
        with:
          name: r9-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/r9/
          retention-days: 30
          if-no-files-found: error
