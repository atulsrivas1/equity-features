name: Remote transport reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wire:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-transport.txt
      - run: python tools/verify_remote_transport.py
