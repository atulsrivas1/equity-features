name: Agent event evidence checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  agent-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/contracts -e packages/evidence -e packages/agent-evidence
      - run: python -m pip check
      - run: python tools/check_boundary.py
      - run: python -m mypy --strict packages/agent-evidence/src examples/agent_events_typed.py
      - run: python -I -m unittest discover -s tests/agent_evidence
      - run: python tools/build_agent_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-${{ github.sha }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: dist/agent-evidence/
          retention-days: 30
          if-no-files-found: error
