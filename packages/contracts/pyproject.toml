[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-contracts"
version = "0.0.3a2"
description = "Experimental in-memory equity feature and supplied-policy contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = []

[project.optional-dependencies]
columnar = ["numpy==2.2.6", "pyarrow==20.0.0"]

[project.urls]
Repository = "https://github.com/atulsrivas1/equity-features"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_contracts = ["py.typed"]
