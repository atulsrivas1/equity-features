[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-agent-evidence"
version = "0.1.0a1"
description = "Experimental pure agent event declarations and supplied evidence checks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = ["equity-feature-contracts==0.0.4a5", "equity-feature-evidence==0.1.0a2"]

[project.urls]
Repository = "https://github.com/atulsrivas1/equity-features"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_agent_evidence = ["py.typed"]
